
<script>
    $(document).ready(function() {
        $('#hookmatomoanalytics-form').on('submit', function(e, data){
            e.preventDefault();
            var form = $(this);

            $('body').append('<div class="modal-backdrop fade in" id="loading-event"><div class="loading"></div></div>');

            $.ajax({
                url: form.attr('action'),
                type: form.attr('method'),
                data: form.serialize()
            }).done(function(){
                $('#loading-event').remove();
            })
            .success(function(data) {
                if (data.error != 0) {
                    $('#loading-event').remove();
                    $('#hookmatomoanalytics-failed-body').html(data.message);
                    $('#hookmatomoanalytics-failed').modal('show');
                }
            })
            .fail(function(jqXHR, textStatus, errorThrown){
                $('#loading-event').remove();
                $('#hookmatomoanalytics-failed-body').html(jqXHR.responseJSON.message);
                $('#hookmatomoanalytics-failed').modal('show');
            });
        });
		
		$('#hookmatomoanalytics_enable_contenttracking').on('click', function() {
			$('#hookmatomoanalytics_enable_contenttracking_visible_only').prop('disabled', !$(this).is(':checked'));
		});
    });
</script>
